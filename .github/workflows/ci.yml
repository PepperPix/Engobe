name: CI

on:
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

# CI runs once per pull request update. A push trigger on top of pull_request ran every
# commit twice and the concurrency group then cancelled one of the runs, which left red
# "cancelled" checks on the PR. Pushes to main/beta are handled by the release workflow;
# use "Run workflow" to run CI on a branch without a pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    # Safety net for hung runs (Mac/Windows runners have occasionally sat stuck for hours instead
    # of the usual ~1-3 min) — TUnit's own per-test DefaultTestTimeout (see GlobalTestSetup.cs in
    # each test project) should already fail a hanging test fast, but this bounds the whole job in
    # case that doesn't fire (e.g. a hang outside test execution, like restore/build).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Enable Test Report Artifacts
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Validate package API compatibility
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack --no-build --configuration Release --include-symbols -p:SymbolPackageFormat=snupkg --output ./artifacts/packages
          dotnet run --file .github/scripts/validate-symbol-packages.cs -- ./artifacts/packages

      - name: Test
        run: dotnet test --no-build --configuration Release -- --maximum-parallel-tests 4

  inspectcode:
    name: InspectCode (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: InspectCode
        run: |
          dotnet tool install -g JetBrains.ReSharper.GlobalTools
          jb inspectcode Engobe.slnx -e=WARNING -f=Text -o=inspect.txt
          cat inspect.txt
